services:
  - type: web
    name: lumina-financas
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: LUMINA_SECRET
        generateValue: true
      - key: LUMINA_DB
        value: lumina.db
      - key: PYTHON_VERSION
        value: 3.11.9
